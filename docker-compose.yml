services:
  app:
    build: .
    container_name: vozplay-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://vozplay_user:vozplay_secret_pass@db:5432/vozplay_db
      - DOMAIN=vozplay.ai.slz.br
      - SUPERVISOR_PASSWORD=${SUPERVISOR_PASSWORD}
      - CONTROLLER_PASSWORD=${CONTROLLER_PASSWORD}
    env_file:
      - path: .env
        required: false
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: vozplay-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=vozplay_user
      - POSTGRES_PASSWORD=vozplay_secret_pass
      - POSTGRES_DB=vozplay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
